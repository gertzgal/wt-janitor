[package]
name = "wt-janitor"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Safely manage Git worktrees: detect integrated worktrees, purge reproducible dependency dirs, report disk savings."
license = "MIT"
readme = "README.md"
publish = false

[[bin]]
name = "wt-janitor"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
comfy-table = "7"
gix = { version = "0.87", default-features = false, features = [
    "max-performance-safe",
    "comfort",
    "basic",
    "extras",
    "sha1",
] }
hex = "0.4"
indicatif = "0.18"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
thiserror = "2"
toml = "0.8"

[dev-dependencies]
tempfile = "3"

[profile.test]
opt-level = 1
